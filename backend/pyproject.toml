[project]
name = "folio-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.12,<0.116", "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
conversion = ["docling==2.139.0"]
test = ["pytest>=8,<9", "pillow>=10,<13", "reportlab>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["folio*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
